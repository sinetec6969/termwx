[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "termwx"
version = "0.4.1"
description = "Terminal weather and aviation console: conditions, forecast, NWS alerts, space weather, METAR/TAF, PIREPs, advisories and an amateur satellite tracker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.0",
    "httpx>=0.27",
    "sgp4>=2.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
termwx = "termwx.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
termwx = ["*.tcss", "data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
